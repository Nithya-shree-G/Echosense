<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EchoSense - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        /* CSS Variables */
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        
        .login-container {
            background: #fff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }

        .login-container h1 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.8em;
            padding-bottom: 10px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            transition: border-color 0.2s;
        }
        
        .input-group input:focus {
            border-color: var(--primary);
            outline: none;
        }

        .auth-form button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .auth-form button:hover {
            opacity: 0.9;
        }

        .btn.primary {
            background: var(--primary);
            color: white;
        }

        .btn.secondary {
            background: var(--secondary);
            color: white;
        }

        .btn.google {
            background: #db4437; /* Google red */
            color: white;
            margin-top: 15px;
        }
        
        .btn.google i {
            margin-right: 8px;
        }
        
        .btn.warning {
            background: var(--warning);
            color: white;
            margin-top: 25px;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            font-size: 0.9em;
            color: #aaa;
            position: relative;
        }

        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 40%;
            height: 1px;
            background: #eee;
        }

        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .error-text {
            color: var(--error);
            margin-top: 15px;
            font-weight: 600;
        }
        
        .forgot-password {
            text-align: right;
            margin-top: 5px;
        }

        .forgot-password a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9em;
            cursor: pointer;
        }
        
        .signup-prompt {
            margin-top: 15px;
            font-size: 0.9em;
            color: #777;
        }
        
        .signup-prompt a {
            color: var(--secondary);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword,
            signInAnonymously,
            onAuthStateChanged,
            sendEmailVerification,
            sendPasswordResetEmail,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            updateProfile // <-- Added for username
        } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyB7BZFWS3JkTFZ_c8sl8E315-4LaWuXfrk",
            authDomain: "echosense-ac4cb.firebaseapp.com",
            projectId: "echosense-ac4cb",
            storageBucket: "echosense-ac4cb.firebasestorage.app",
            messagingSenderId: "42422010561",
            appId: "1:42422010561:web:60446884538bdcf49d0a40",
            measurementId: "G-DSH8GNNSX3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        
        // Expose functions globally for the main script block
        window.auth = auth;
        window.signInWithEmailAndPassword = signInWithEmailAndPassword;
        window.createUserWithEmailAndPassword = createUserWithEmailAndPassword;
        window.signInAnonymously = signInAnonymously;
        window.onAuthStateChanged = onAuthStateChanged;
        window.sendEmailVerification = sendEmailVerification;
        window.sendPasswordResetEmail = sendPasswordResetEmail;
        window.GoogleAuthProvider = GoogleAuthProvider;
        window.signInWithPopup = signInWithPopup;
        window.signOut = signOut;
        window.updateProfile = updateProfile; // <-- Added for username
    </script>
</head>
<body>

    <div class="login-container">
        
        <h1>Sign In to EchoSense</h1>
        
        <form id="authForm" class="auth-form">

            <div class="input-group" id="usernameGroup" style="display:none;">
                <label for="username"><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" required>
            </div>
            
            <div class="input-group">
                <label for="email"><i class="fas fa-envelope"></i> Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="input-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" required>
            </div>
            
            <div class="forgot-password">
                <a id="resetPasswordLink">Forgot Password?</a>
            </div>

            <button type="button" id="signInBtn" class="btn primary">Sign In</button>
            <button type="button" id="signUpBtn" class="btn secondary" style="display:none;">Create Account</button>
            
            <p class="signup-prompt">
                New to EchoSense? <a id="showSignUpLink">Create an account</a>
            </p>
            
            <div class="divider">OR</div>
            
            <button type="button" id="googleSignInBtn" class="btn google"><i class="fab fa-google"></i> Sign In with Google</button>
            
            <button type="button" id="guestBtn" class="btn warning"><i class="fas fa-user-secret"></i> Continue as Guest</button>
        </form>
        <p id="error-message" class="error-text"></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const emailInput = document.getElementById('email');
            const usernameInput = document.getElementById('username'); // New reference
            const usernameGroup = document.getElementById('usernameGroup'); // New reference
            const passwordInput = document.getElementById('password');
            const signInBtn = document.getElementById('signInBtn');
            const signUpBtn = document.getElementById('signUpBtn');
            const googleSignInBtn = document.getElementById('googleSignInBtn');
            const guestBtn = document.getElementById('guestBtn');
            const resetPasswordLink = document.getElementById('resetPasswordLink');
            const errorMessage = document.getElementById('error-message');
            const showSignUpLink = document.getElementById('showSignUpLink');
            const signupPromptContainer = showSignUpLink.closest('.signup-prompt');

            const redirectToApp = () => {
                window.location.href = 'index.html'; 
            };

            const displayError = (message, isSuccess = false) => {
                errorMessage.style.color = isSuccess ? 'var(--success)' : 'var(--error)';
                errorMessage.textContent = message.replace('Firebase:', '').trim();
                setTimeout(() => { errorMessage.textContent = '', errorMessage.style.color = 'var(--error)'; }, isSuccess ? 8000 : 4000);
            };

            // SIGN UP LINK LOGIC: This toggles the form view
            showSignUpLink.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelector('h1').textContent = 'Create Your Account';
                signInBtn.style.display = 'none';
                signUpBtn.style.display = 'block';
                usernameGroup.style.display = 'block'; // Show Username field
                signupPromptContainer.style.display = 'none'; // Hide the link
            });
            
            // 1. SIGN IN (Email/Password)
            signInBtn.addEventListener('click', async () => {
                try {
                    const userCredential = await window.signInWithEmailAndPassword(window.auth, emailInput.value, passwordInput.value);
                    const user = userCredential.user;
                    
                    if (!user.emailVerified) {
                        await window.signOut(window.auth);
                        displayError('Please verify your email address before logging in.', false);
                        return;
                    }
                    redirectToApp();
                } catch (error) {
                    displayError('Sign In Failed: Invalid credentials or account not verified.', false);
                }
            });

            // 2. SIGN UP (Create Account with Email Verification and Username)
            signUpBtn.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                if (!username) { // Simple validation
                    displayError('Username is required.', false);
                    return;
                }
                
                try {
                    const userCredential = await window.createUserWithEmailAndPassword(window.auth, emailInput.value, passwordInput.value);
                    const user = userCredential.user;
                    
                    // CRITICAL: Save the username to the profile
                    await window.updateProfile(user, {
                        displayName: username 
                    });
                    
                    await window.sendEmailVerification(user);
                    
                    // Log out immediately after creation
                    await window.signOut(window.auth); 
                    
                    displayError('Account created! A verification email has been sent. Please verify your email before signing in.', true);
                    
                    // Switch back to Sign In view after successful sign up
                    document.querySelector('h1').textContent = 'Sign In to EchoSense';
                    signInBtn.style.display = 'block';
                    signUpBtn.style.display = 'none';
                    usernameGroup.style.display = 'none'; // Hide Username field
                    signupPromptContainer.style.display = 'block'; // Show the prompt link again
                } catch (error) {
                    displayError('Sign Up Failed: ' + error.message, false);
                }
            });

            // 3. PASSWORD RESET
            resetPasswordLink.addEventListener('click', async () => {
                const email = emailInput.value.trim();
                if (!email) {
                    displayError('Please enter your email address to reset your password.', false);
                    return;
                }
                
                try {
                    await window.sendPasswordResetEmail(window.auth, email);
                    displayError(`Password reset link sent to ${email}. Check your inbox!`, true);
                } catch (error) {
                    displayError('Password Reset Failed. Check the email address is correct.', false);
                }
            });

            // 4. GOOGLE SIGN-IN
            googleSignInBtn.addEventListener('click', async () => {
                const provider = new window.GoogleAuthProvider();
                try {
                    await window.signInWithPopup(window.auth, provider);
                    redirectToApp();
                } catch (error) {
                    displayError('Google Sign-In failed: ' + error.message, false);
                }
            });

            // 5. GUEST SIGN-IN
            guestBtn.addEventListener('click', async () => {
                try {
                    await window.signInAnonymously(window.auth); 
                    redirectToApp();
                } catch (error) {
                    displayError('Guest sign-in failed: ' + error.message, false);
                }
            });
            
            // Check auth state on load
            if (window.onAuthStateChanged && window.auth) {
                 window.onAuthStateChanged(window.auth, user => {
                    if (user && (user.emailVerified || user.isAnonymous)) {
                        redirectToApp();
                    }
                 });
            }
        });
    </script>
    
</body>
</html>
